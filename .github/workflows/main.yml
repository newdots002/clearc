name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.0)'
        required: true
        default: '1.0.0'

env:
  APP_NAME: ClearC

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows (amd64)
        run: wails build -platform windows/amd64 -nsis
        
      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Package Windows
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive -Path "build\bin\*" -DestinationPath "ClearC-$version-windows-amd64.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            ClearC-*.zip
            build/bin/*.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS (${{ matrix.arch }})
        run: wails build -platform darwin/${{ matrix.arch }}

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Package macOS
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          cd build/bin
          zip -r "../../ClearC-$version-macos-${{ matrix.arch }}.zip" *.app
          
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: ClearC-*.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux (amd64)
        run: wails build -platform linux/amd64 -tags webkit2_41

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Package Linux (tar.gz)
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          cd build/bin
          tar -czvf "../../ClearC-$version-linux-amd64.tar.gz" *

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: ClearC-*-linux-amd64.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ClearC v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: artifacts/*
          body: |
            ## ClearC v${{ steps.version.outputs.VERSION }}
            
            ### 下载
            
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | **Windows** | `ClearC-${{ steps.version.outputs.VERSION }}-windows-amd64.zip` | 解压后运行 |
            | **macOS (Intel)** | `ClearC-${{ steps.version.outputs.VERSION }}-macos-amd64.zip` | 解压后拖入应用程序 |
            | **macOS (Apple Silicon)** | `ClearC-${{ steps.version.outputs.VERSION }}-macos-arm64.zip` | 解压后拖入应用程序 |
            | **Linux** | `ClearC-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz` | 需要先安装依赖 |
            
            ### Linux 使用说明
            
            Linux 版本需要先安装 WebKit2GTK 4.1 依赖：
            
            ```bash
            # Ubuntu 24.04+ / Debian 12+
            sudo apt install libwebkit2gtk-4.1-0
            
            # Fedora 39+
            sudo dnf install webkit2gtk4.1
            
            # Arch Linux
            sudo pacman -S webkit2gtk-4.1
            
            # openSUSE Tumbleweed
            sudo zypper install libwebkit2gtk-4_1-0
            ```
            
            然后解压运行：
            ```bash
            tar -xzf ClearC-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            chmod +x ClearC
            ./ClearC
            ```
